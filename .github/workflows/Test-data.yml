name: Cross Repository Artifact Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-access:
    runs-on: ubuntu-latest

    steps:
      - name: Check cross-repository artifact access
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN_dummy }}
        run: |
          OWNER="H-ghanshyam123"
          REPO="repo-test-action"
          ARTIFACT_ID="YOUR_ARTIFACT_ID"

          RESPONSE=$(curl -sS \
            -w "\n%{http_code}" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$OWNER/$REPO/actions/artifacts/$ARTIFACT_ID")

          STATUS=$(echo "$RESPONSE" | tail -n 1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "HTTP Status: $STATUS"
          echo "API Response:"
          echo "$BODY"
